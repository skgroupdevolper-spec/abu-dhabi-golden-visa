name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://www.abudhabigoldenvisa.com
      PORTAL_HOST: app.abudhabigoldenvisa.com
      DATA_DIR: ./data
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-password-123
      SESSION_SECRET: ci-secret-0123456789abcdef
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Smoke test
        run: |
          node scripts/seed-sample.mjs
          npm start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          set -e
          for path in / /golden-visa/property-investment/ /golden-visa-cost/ /visa-check/ /ar/ /ur/golden-visa/ /contact/ /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || { cat server.log; exit 1; }
          done
          portal=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: app.abudhabigoldenvisa.com" http://localhost:3000/login/)
          echo "$portal portal host"
          [ "$portal" = "200" ]
          for path in /admin/login/ /portal/login/ /portal/register/ /portal/forgot/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || { cat server.log; exit 1; }
          done
          admin=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin/)
          echo "$admin admin without sign-in (expect redirect)"
          [ "$admin" = "307" ] || [ "$admin" = "303" ] || [ "$admin" = "302" ] || { cat server.log; exit 1; }
          pdf=$(curl -s -o q.pdf -w "%{http_code} %{content_type}" -X POST -H "Content-Type: application/json" -d '{"name":"CI","desc":"Property investor","lines":[["Visa","1614.25"]],"total":"AED 1,614.25","date":"5 November 2026"}' http://localhost:3000/api/quote-pdf/)
          echo "$pdf quote pdf"; head -c 5 q.pdf; echo
          case "$pdf" in "200 application/pdf"*) ;; *) cat server.log; exit 1;; esac
          for path in /services/maid-visa/ /golden-visa-for-indians/ /blog/abu-dhabi-golden-visa-complete-guide/ /golden-visa/frontline-heroes/ /ar/services/difc-wills/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || { cat server.log; exit 1; }
          done
          lead=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"name":"CI test","phone":"+971500000000","source":"ci"}' http://localhost:3000/api/leads/)
          echo "$lead lead api"
          [ "$lead" = "200" ]
          printf 'sample' > doc.txt
          apply=$(curl -s -w " %{http_code}" -F service=gv-property -F name="CI Applicant" -F phone=+971500000002 -F email=ci@example.com -F where=in -F consent=true -F 'family=[{"relation":"Spouse","name":"CI Spouse","adult":true}]' -F files=@doc.txt -F labels="Passport copy (valid 6+ months)" http://localhost:3000/api/apply/)
          echo "$apply apply api"
          case "$apply" in *'"ok":true'*" 200") ;; *) cat server.log; exit 1;; esac
          for path in /apply/ /ar/apply/ /family-golden-visa/newborn/ /services/iloe-insurance/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || { cat server.log; exit 1; }
          done
      - name: Screenshots
        run: |
          mkdir -p shots
          npx -y playwright@1.49.1 screenshot --channel chrome --full-page --wait-for-timeout 2500 --viewport-size 1440,900 http://localhost:3000/ shots/home-desktop.png
          npx -y playwright@1.49.1 screenshot --channel chrome --full-page --wait-for-timeout 2500 -b cr --device "Pixel 7" http://localhost:3000/ shots/home-mobile.png
          npx -y playwright@1.49.1 screenshot --channel chrome --full-page --wait-for-timeout 1500 --viewport-size 1440,900 http://localhost:3000/golden-visa/property-investment/ shots/property.png
          npx -y playwright@1.49.1 screenshot --channel chrome --wait-for-timeout 1500 --viewport-size 1440,900 http://localhost:3000/ar/ shots/arabic.png
      - name: Browser check
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          node scripts/check-pages.mjs
      - name: Publish screenshots to ci-shots branch
        if: always() && github.event_name == 'push'
        run: |
          cd shots
          git init -q -b ci-shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-shots
