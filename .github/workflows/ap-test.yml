name: Auto Publisher test
on:
  workflow_dispatch:
  push:
    branches: [builder-ap]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SITE_URL: https://www.abudhabigoldenvisa.com
      PORTAL_HOST: app.abudhabigoldenvisa.com
      DATA_DIR: ./data
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-password-123
      SESSION_SECRET: ci-secret-0123456789abcdef
      AUTOPUBLISHER_FAKE_AI: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dry run (fake AI)
        run: |
          PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:3000/admin/login/ && break; sleep 2; done
          npm i --no-save playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/ap-test/run.mjs || (echo '--- server log'; tail -80 server.log; exit 1)
      - name: Screenshots to the ap-shots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots && git init -q -b ap-shots && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "ap screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ap-shots
